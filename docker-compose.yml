services:
  app:
    build: .
    container_name: ai-cto-daily
    ports:
      - "8765:8765"
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
      - ./.env:/app/.env:ro
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    # The web service auto-starts the built-in scheduler when
    # data/config.json has schedule.enabled=true.
